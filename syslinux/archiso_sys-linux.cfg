LABEL berzelius
TEXT HELP
Boot the BerzeliusOS live system on BIOS.
Equipped with chemical computing suite, Kalzium, and Arch installer.
ENDTEXT
MENU LABEL Boot BerzeliusOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL berzeliusspeech
TEXT HELP
Boot BerzeliusOS on BIOS with speakup screen reader.
ENDTEXT
MENU LABEL Boot BerzeliusOS Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
