<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03060d" />
    </radialGradient>
    
    <radialGradient id="chemGlow" cx="420" cy="580" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="8%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="95%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.30" />
    </linearGradient>

    <linearGradient id="liquidGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#22d3ee" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern: Lab Metric Grid -->
    <pattern id="labGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6" />
      <path d="M 30 0 L 30 60 M 0 30 L 60 30" fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#labGrid)" />
  
  <!-- Ambient Liquid Chemistry Glow -->
  <circle cx="420" cy="580" r="350" fill="url(#chemGlow)" />

  <!-- Chemical Hexagonal Molecules in Background (Right & Top) -->
  <g stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.12">
    <!-- Benzene / Anthracene rings -->
    <polygon points="1200,200 1250,170 1300,200 1300,260 1250,290 1200,260" />
    <polygon points="1300,200 1350,170 1400,200 1400,260 1350,290 1300,260" />
    <polygon points="1400,200 1450,170 1500,200 1500,260 1450,290 1400,260" />
    <circle cx="1250" cy="230" r="28" stroke-dasharray="4,4" />
    <circle cx="1350" cy="230" r="28" stroke-dasharray="4,4" />
    
    <polygon points="1550,600 1600,570 1650,600 1650,660 1600,690 1550,660" />
    <polygon points="1650,600 1700,570 1750,600 1750,660 1700,690 1650,660" />
    <circle cx="1600" cy="630" r="26" stroke-dasharray="4,4" />
  </g>

  <!-- Berzelius Discovery Elements Badges -->
  <g font-family="monospace, sans-serif" opacity="0.35">
    <!-- Silicon -->
    <rect x="1100" y="720" width="70" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="1110" y="740" fill="#38bdf8" font-size="12">14</text>
    <text x="1135" y="762" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Si</text>
    <text x="1135" y="780" fill="#94a3b8" font-size="9" text-anchor="middle">28.085</text>

    <!-- Selenium -->
    <rect x="1190" y="720" width="70" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="1200" y="740" fill="#38bdf8" font-size="12">34</text>
    <text x="1225" y="762" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Se</text>
    <text x="1225" y="780" fill="#94a3b8" font-size="9" text-anchor="middle">78.971</text>

    <!-- Cerium -->
    <rect x="1280" y="720" width="70" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="1290" y="740" fill="#38bdf8" font-size="12">58</text>
    <text x="1315" y="762" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Ce</text>
    <text x="1315" y="780" fill="#94a3b8" font-size="9" text-anchor="middle">140.11</text>

    <!-- Thorium -->
    <rect x="1370" y="720" width="70" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="1380" y="740" fill="#38bdf8" font-size="12">90</text>
    <text x="1405" y="762" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Th</text>
    <text x="1405" y="780" fill="#94a3b8" font-size="9" text-anchor="middle">232.03</text>

    <!-- Zirconium -->
    <rect x="1460" y="720" width="70" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="1470" y="740" fill="#38bdf8" font-size="12">40</text>
    <text x="1495" y="762" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Zr</text>
    <text x="1495" y="780" fill="#94a3b8" font-size="9" text-anchor="middle">91.224</text>
  </g>

  <!-- ======================================================== -->
  <!-- THE BERZELIUS BEAKER (Tall-Form Lab Glassware: H = 2 * D) -->
  <!-- Dimensions: Diameter = 240px, Height = 480px               -->
  <!-- Center X = 420, Top Y = 280, Bottom Y = 760               -->
  <!-- Left = 300, Right = 540                                   -->
  <!-- ======================================================== -->
  <g id="berzelius-beaker">
    <!-- Shadow beneath beaker -->
    <ellipse cx="420" cy="775" rx="130" ry="22" fill="#000000" opacity="0.6" filter="url(#neonBlur)" />

    <!-- Glass Interior Backside -->
    <rect x="300" y="300" width="240" height="450" rx="16" fill="#031525" opacity="0.4" />

    <!-- REACTION LIQUID (Cyan Luminescent Solution inside Beaker) -->
    <!-- Liquid fills from Y=500 down to Y=746 (height 246px) -->
    <path d="M 304 515
             Q 360 528, 420 528
             Q 480 528, 536 515
             L 536 740
             Q 536 756, 516 756
             L 324 756
             Q 304 756, 304 740
             Z"
          fill="url(#liquidGrad)" />

    <!-- Liquid Meniscus Surface Curve (Top of the solution) -->
    <ellipse cx="420" cy="515" rx="116" ry="14" fill="#38bdf8" opacity="0.3" />
    <path d="M 304 515 Q 420 535, 536 515" fill="none" stroke="#e0f2fe" stroke-width="3" filter="url(#softGlow)" />

    <!-- Effervescent Micro Bubbles inside solution -->
    <g fill="#e0f2fe" opacity="0.75" filter="url(#softGlow)">
      <circle cx="340" cy="720" r="3.5" />
      <circle cx="355" cy="670" r="2.5" />
      <circle cx="348" cy="610" r="4.0" />
      <circle cx="380" cy="735" r="2.0" />
      <circle cx="395" cy="650" r="3.0" />
      <circle cx="410" cy="580" r="4.5" />
      <circle cx="440" cy="710" r="3.0" />
      <circle cx="455" cy="630" r="2.5" />
      <circle cx="475" cy="680" r="4.0" />
      <circle cx="490" cy="590" r="3.0" />
      <circle cx="505" cy="730" r="2.0" />
      <circle cx="430" cy="540" r="5.0" />
    </g>

    <!-- Outer Borosilicate Glass Body -->
    <rect x="300" y="300" width="240" height="452" rx="16"
          fill="url(#glassWall)" stroke="#7dd3fc" stroke-width="2.5" opacity="0.9" />

    <!-- Bottom Rim Thick Borosilicate Base -->
    <path d="M 300 735 Q 300 760, 324 760 L 516 760 Q 540 760, 540 735"
          fill="none" stroke="#bae6fd" stroke-width="5" opacity="0.7" />

    <!-- Top Beaker Lip & Pouring Spout -->
    <!-- Left spout flare at (285, 292) -->
    <path d="M 285 292 
             Q 296 298, 304 300
             L 536 300
             Q 544 300, 544 296
             Q 544 292, 536 292
             L 300 292
             Q 288 292, 285 292 Z"
          fill="url(#rimGrad)" stroke="#e0f2fe" stroke-width="1.8" />
    
    <!-- Top Opening Ellipse -->
    <ellipse cx="420" cy="296" rx="118" ry="10" fill="none" stroke="#bae6fd" stroke-width="1.8" opacity="0.75" />

    <!-- Specular Reflection Highlight (Left Glass Edge) -->
    <path d="M 312 315 L 312 730" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.45" filter="url(#softGlow)" />
    <path d="M 320 330 L 320 710" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    
    <!-- Specular Reflection Highlight (Right Glass Edge) -->
    <path d="M 528 315 L 528 730" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />

    <!-- Glassware Titration Graduation Marks (Milliliters) -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.85">
      <!-- 400 mL -->
      <line x1="330" y1="380" x2="375" y2="380" />
      <text x="385" y="385" fill="#e0f2fe" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="600">400 ml</text>

      <line x1="330" y1="420" x2="355" y2="420" stroke-width="1.2" />

      <!-- 300 mL -->
      <line x1="330" y1="460" x2="375" y2="460" />
      <text x="385" y="465" fill="#e0f2fe" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="600">300</text>

      <line x1="330" y1="500" x2="355" y2="500" stroke-width="1.2" />

      <!-- 200 mL -->
      <line x1="330" y1="540" x2="375" y2="540" />
      <text x="385" y="545" fill="#e0f2fe" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="600">200</text>

      <line x1="330" y1="580" x2="355" y2="580" stroke-width="1.2" />

      <!-- 100 mL -->
      <line x1="330" y1="620" x2="375" y2="620" />
      <text x="385" y="625" fill="#e0f2fe" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="600">100</text>

      <line x1="330" y1="660" x2="355" y2="660" stroke-width="1.2" />

      <!-- 50 mL -->
      <line x1="330" y1="700" x2="368" y2="700" />
      <text x="378" y="704" fill="#e0f2fe" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="500">50</text>
    </g>

    <!-- Lab Glassware Stamp / Badge on the Beaker -->
    <g transform="translate(425, 410)" opacity="0.75">
      <circle cx="45" cy="20" r="16" fill="none" stroke="#bae6fd" stroke-width="1" />
      <text x="45" y="24" fill="#e0f2fe" font-family="'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bz</text>
      <text x="45" y="44" fill="#93c5fd" font-family="'DejaVu Sans', sans-serif" font-size="8" text-anchor="middle" letter-spacing="1">BORO 3.3</text>
      <text x="45" y="54" fill="#93c5fd" font-family="'DejaVu Sans', sans-serif" font-size="7" text-anchor="middle">BERZELIUS</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- DISTRO TITLE & BRANDING (Right Hand Side)                -->
  <!-- ======================================================== -->
  <g transform="translate(740, 360)">
    <!-- Cyan glow accent bar -->
    <rect x="0" y="0" width="8" height="150" rx="4" fill="#38bdf8" filter="url(#softGlow)" />

    <!-- Subtitle Category Tag -->
    <text x="28" y="24" fill="#06b6d4" font-family="'DejaVu Sans', monospace" font-size="16" font-weight="bold" letter-spacing="4">
      ARCH-BASED SCIENTIFIC WORKSTATION
    </text>

    <!-- Main Title -->
    <text x="25" y="90" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="68" font-weight="800" letter-spacing="2">
      Berzelius<tspan fill="#38bdf8">OS</tspan>
    </text>

    <!-- Tagline -->
    <text x="28" y="132" fill="#94a3b8" font-family="'DejaVu Sans', sans-serif" font-size="22" font-weight="300" letter-spacing="1.5">
      The Tall-Form Glassware Edition
    </text>

    <!-- Description & Chemistry Philosophy -->
    <g transform="translate(28, 175)" font-family="'DejaVu Sans', sans-serif" fill="#cbd5e1" font-size="15" opacity="0.85">
      <text x="0" y="0">"In scientific inquiry, precise glassware yields pure truths."</text>
      <text x="0" y="24" fill="#64748b" font-size="13">— Dedicated to Jöns Jacob Berzelius (1779–1848), Architect of Chemical Symbols</text>

      <!-- Feature pills -->
      <g transform="translate(0, 50)" font-family="monospace" font-size="12">
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
        <text x="65" y="18" fill="#38bdf8" text-anchor="middle">ROLLING ARCH</text>

        <rect x="145" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
        <text x="217" y="18" fill="#38bdf8" text-anchor="middle">CHEMISTRY SUITE</text>

        <rect x="305" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
        <text x="377" y="18" fill="#22d3ee" text-anchor="middle">GLASS COMPOSITOR</text>
      </g>
    </g>
  </g>

  <!-- Clean Bottom Status Strip -->
  <g transform="translate(0, 1040)">
    <rect width="1920" height="40" fill="#030712" opacity="0.8" />
    <line x1="0" y1="0" x2="1920" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="40" y="25" fill="#64748b" font-family="'DejaVu Sans', sans-serif" font-size="13">
      BerzeliusOS 2026 • Chemical Symbolism &amp; Precision Computing • Linux Rolling
    </text>
    <text x="1880" y="25" fill="#38bdf8" font-family="monospace" font-size="13" text-anchor="end">
      SiO₂ • B₂O₃ • Na₂O • Al₂O₃ [Borosilicate 3.3]
    </text>
  </g>
</svg>
