# BerzeliusOS Borosilicate Glass Compositor Configuration (Picom)
# Emulates the optical refraction and frosted transparency of laboratory glassware.

backend = "glx";

# Opacity Rules (Frosted Glass Translucency)
active-opacity = 0.94;
inactive-opacity = 0.88;
frame-opacity = 0.85;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'Xfce4-terminal'",
  "92:class_g = 'Alacritty'",
  "90:class_g = 'Xfce4-panel'",
  "96:class_g = 'Kalzium'",
  "96:class_g = 'Avogadro'",
  "100:class_g = 'firefox'"
];

# Laboratory Glass Corner Curvature
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Optical Blur (Meniscus & Borosilicate Dispersion)
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# Soft Refraction Shadows
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.45;
shadow-color = "#040d1a";

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;

# vsync to prevent tearing
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
